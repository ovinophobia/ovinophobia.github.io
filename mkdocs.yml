site_name: ovino
site_url: https://ovinophobia.github.io/
site_description: 我的个人网站，记录课程、学习与生活。

theme:
  name: material
  language: zh
  palette:
    scheme: default
    primary: white
    accent: indigo
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - content.code.copy
  font: false

nav:
  - 主页: index.md
  - 课程: course/index.md
  - 一路走来:
      - 今日大学习: journey/study/index.md
      - 随记: journey/notes/index.md
      - 足迹: journey/footprints/index.md
  - 歌词:
      - 歌词列表: lyrics/index.md
      - God Knows: lyrics/god-knows.md
      - キミがいれば: lyrics/kimi-ga-ireba.md
      - 時の流れに身をまかせ: lyrics/toki-no-nagare-ni-mi-wo-makase.md
      - Stay With Me: lyrics/stay-with-me.md
  - 友链: friends/index.md
  - 关于: about/index.md

plugins:
  - search:
      lang: zh

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/lyrics.css

extra:
  generator: false
